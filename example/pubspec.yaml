name: klinex_example
description: "Demonstrates how to use the klinex package."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  get: ^4.7.3
  dio: ^5.11.1
  flutter_smart_dialog: ^5.1.1
  web_socket_channel: ^3.0.3
  path_provider: ^2.1.6

  klinex:
    path: ../
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  flutter_lints: ^6.0.0
  intl_utils: ^2.8.17

flutter:
  uses-material-design: true

flutter_intl:
  enabled: true
  class_name: S
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/l10n/generated
